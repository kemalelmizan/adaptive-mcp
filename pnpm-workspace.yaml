packages:
  - "packages/*"
  - "apps/*"
  - "examples"
  - "examples/*"

# Security overrides: force patched transitive versions pulled in by the MCP
# SDK's HTTP transports (hono / @hono/node-server, express -> body-parser / qs /
# proxy-addr, express-rate-limit -> ip-address, ajv -> fast-uri) and dev-only
# js-yaml trees. Caret floors guarantee patched minimums without freezing future
# point fixes. See README's "Security" note.
overrides:
  hono: "^4.13.16"
  "@hono/node-server": "^2.1.3"
  body-parser: "^2.4.0"
  qs: "^6.17.0"
  proxy-addr: "^2.0.8"
  express-rate-limit: "^8.7.4"
  ip-address: "^10.7.4"
  fast-uri: "^3.1.9"
  "js-yaml@<4": "^3.15.2"
  "js-yaml@4": "^4.3.2"

onlyBuiltDependencies:
  - esbuild
  - "@modelcontextprotocol/sdk"
allowBuilds:
  esbuild: true
  "@modelcontextprotocol/sdk": true
