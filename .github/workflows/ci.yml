name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Doc consistency
        run: pnpm docs:check

      - name: Build
        run: pnpm -r --filter "./packages/*" run build

      - name: Test
        run: pnpm test

      - name: Coverage gate
        run: pnpm test:coverage

      # Release dry-run gate: ensures the publish path (build + changeset
      # status) is healthy so a broken publish can't ship. Does NOT publish.
      - name: Release dry-run
        run: node scripts/release.ts --dry-run

  integration:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        run: pnpm -r --filter "./packages/*" run build

      - name: Build examples
        run: pnpm --filter @adaptivemcp/examples run build

      - name: Integration test (real stdio MCP server)
        run: pnpm test:integration
